<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3150">
  <meta name="description" content="ZedMoney digital wallet">
  <title>ZedMoney — Secure digital wallet</title>
  <style>
    :root {
      --navy-950:#071e31; --navy-900:#0a3150; --navy-800:#104365; --navy-700:#155a80;
      --blue-100:#e7f1f7; --blue-50:#f4f8fb; --ink:#10202d; --muted:#607080; --muted-2:#8997a3;
      --line:#dfe7ec; --surface:#ffffff; --page:#f5f8fa; --green:#1f8b67; --green-bg:#e8f6f0;
      --amber:#a66b13; --amber-bg:#fff5df; --red:#bb4c4c; --red-bg:#fff0f0;
      --shadow:0 10px 28px rgba(14,48,71,.06); --shadow-deep:0 20px 60px rgba(8,33,52,.16);
      --radius:14px; --radius-sm:10px; --max:1280px;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink); background:var(--page); font-synthesis:none;
    }
    * { box-sizing:border-box; }
    html { min-width:320px; scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; background:var(--page); }
    button,input,select,textarea { font:inherit; }
    button { border:0; cursor:pointer; }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible {
      outline:3px solid rgba(21,90,128,.2); outline-offset:2px;
    }
    .app-shell { display:flex; min-height:100vh; }
    .sidebar { width:246px; background:var(--navy-950); color:#d7e6ee; padding:24px 14px 18px; display:flex; flex-direction:column; position:fixed; inset:0 auto 0 0; z-index:20; overflow-y:auto; }
    .brand { display:flex; align-items:center; gap:11px; color:white; text-decoration:none; padding:2px 12px 26px; }
    .brand strong { font-size:18px; letter-spacing:-.4px; }
    .logo-mark { width:34px; height:27px; flex:0 0 auto; }
    .nav-group { margin-top:8px; }
    .nav-label { color:#7f9aab; font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; padding:13px 14px 8px; }
    .nav-link { width:100%; display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:9px; color:#b8cad4; background:transparent; text-align:left; margin:2px 0; transition:background .2s,color .2s,transform .2s; }
    .nav-link:hover { color:white; background:rgba(255,255,255,.08); transform:translateX(1px); }
    .nav-link.active { color:white; background:#174b6b; box-shadow:inset 3px 0 0 #79c4ca; }
    .nav-link svg { width:18px; height:18px; stroke-width:1.8; }
    .sidebar-spacer { flex:1; }
    .sidebar-foot { border-top:1px solid rgba(255,255,255,.12); padding:17px 12px 2px; color:#88a3b2; font-size:11px; line-height:1.5; }
    .sidebar-foot b { display:block; color:#dceaf0; margin-bottom:2px; font-size:12px; }
    .main { flex:1; margin-left:246px; min-width:0; }
    .topbar { height:76px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.9); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:space-between; padding:0 clamp(20px,4vw,52px); position:sticky; top:0; z-index:10; }
    .topbar-left,.topbar-actions,.title-row { display:flex; align-items:center; gap:13px; }
    .mobile-menu { display:none; background:transparent; color:var(--navy-900); padding:8px; }
    .page-kicker { color:var(--muted); font-size:12px; margin-bottom:3px; }
    .page-title { font-size:20px; letter-spacing:-.4px; margin:0; font-weight:700; }
    .icon-btn { width:38px; height:38px; display:inline-grid; place-items:center; border-radius:9px; color:var(--muted); background:transparent; transition:.2s; position:relative; }
    .icon-btn:hover { background:var(--blue-50); color:var(--navy-900); }
    .icon-btn svg { width:19px; height:19px; }
    .notification-dot { width:18px; height:18px; border:2px solid white; border-radius:50%; background:#c55b53; color:white; display:grid; place-items:center; font-size:9px; font-style:normal; font-weight:750; position:absolute; right:-2px; top:-3px; }
    .avatar { width:36px; height:36px; border-radius:50%; background:#d7e9e9; color:var(--navy-900); display:grid; place-items:center; font-size:12px; font-weight:700; }
    .profile-wrap { position:relative; }
    .profile-menu { display:none; position:absolute; right:0; top:47px; background:white; border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow-deep); padding:7px; width:190px; z-index:30; }
    .profile-menu.open { display:block; animation:fadeUp .18s ease-out; }
    .profile-menu button { width:100%; text-align:left; background:none; padding:10px 11px; color:var(--ink); border-radius:7px; font-size:13px; }
    .profile-menu button:hover { background:var(--blue-50); }
    .content { max-width:var(--max); margin:0 auto; padding:38px clamp(20px,4vw,52px) 80px; }
    .view { animation:none; }
    .welcome { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:25px; }
    h1,h2,h3,p { margin-top:0; }
    h1 { font-size:29px; letter-spacing:-.8px; margin-bottom:7px; }
    h2 { font-size:17px; letter-spacing:-.25px; margin-bottom:4px; }
    h3 { font-size:14px; margin-bottom:4px; }
    .subtitle { color:var(--muted); margin:0; font-size:14px; }
    .muted { color:var(--muted); }
    .small { font-size:12px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
    .card-pad { padding:22px; }
    .dashboard-grid { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr); gap:20px; }
    .balance-card { min-height:222px; padding:27px 29px; color:white; background:var(--navy-900); position:relative; overflow:hidden; border:0; }
    .balance-card:after { content:""; position:absolute; width:250px; height:250px; right:-80px; top:-120px; border:1px solid rgba(255,255,255,.14); border-radius:50%; box-shadow:0 0 0 30px rgba(255,255,255,.035),0 0 0 62px rgba(255,255,255,.025); }
    .balance-head,.balance-value-row,.balance-foot { position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; }
    .balance-head { color:#a9c4d1; font-size:12px; }
    .balance-head .status { color:#9dd8be; display:flex; align-items:center; gap:6px; }
    .status-dot { width:6px; height:6px; background:#65c399; border-radius:50%; }
    .balance-value-row { justify-content:flex-start; gap:12px; margin:24px 0 28px; }
    .balance-value { font-size:36px; letter-spacing:-1.6px; font-weight:700; }
    .currency { font-size:12px; color:#a9c4d1; align-self:flex-end; padding-bottom:8px; }
    .balance-foot { color:#a9c4d1; font-size:11px; }
    .balance-card .icon-btn { color:#cfe0e8; width:30px; height:30px; }
    .balance-card .icon-btn:hover { background:rgba(255,255,255,.1); color:white; }
    .quick-card { padding:22px 22px 18px; }
    .section-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:17px; }
    .section-heading h2 { margin:0; }
    .text-btn { background:none; color:var(--navy-700); font-size:12px; font-weight:650; padding:4px; }
    .text-btn:hover { color:var(--navy-950); text-decoration:underline; }
    .action-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
    .action { display:flex; flex-direction:column; gap:9px; align-items:center; background:transparent; color:var(--ink); font-size:11px; padding:8px 3px; border-radius:10px; transition:.2s; }
    .action:hover { background:var(--blue-50); transform:translateY(-1px); }
    .action-icon { width:42px; height:42px; border-radius:11px; display:grid; place-items:center; background:var(--blue-100); color:var(--navy-700); }
    .action-icon svg { width:19px; height:19px; }
    .action-grid.secondary { grid-template-columns:repeat(4,1fr); margin-top:12px; padding-top:13px; border-top:1px solid var(--line); }
    .action-grid.secondary .action-icon { width:33px; height:33px; background:#f1f4f6; color:var(--muted); border-radius:9px; }
    .action-grid.secondary .action { gap:6px; color:var(--muted); }
    .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:20px 0; }
    .stat-card { padding:18px 19px; }
    .stat-label { color:var(--muted); font-size:12px; margin-bottom:11px; }
    .stat-value { font-weight:700; font-size:20px; letter-spacing:-.4px; }
    .stat-detail { color:var(--muted-2); font-size:11px; margin-top:6px; }
    .two-col { display:grid; grid-template-columns:minmax(0,1.42fr) minmax(280px,1fr); gap:20px; }
    .transactions-card { padding:22px; }
    .transaction { width:100%; border:0; border-bottom:1px solid #edf1f3; padding:14px 0; display:flex; align-items:center; gap:12px; background:none; text-align:left; color:inherit; transition:.18s; }
    .transaction:last-child { border-bottom:0; padding-bottom:0; }
    .transaction:first-of-type { padding-top:4px; }
    .transaction:hover .transaction-title { color:var(--navy-700); }
    .tx-icon { width:38px; height:38px; flex:0 0 auto; display:grid; place-items:center; border-radius:50%; background:#f1f5f6; color:var(--navy-700); }
    .tx-icon.in { color:var(--green); background:var(--green-bg); }
    .tx-icon.out { color:var(--navy-700); background:var(--blue-100); }
    .tx-icon.failed { color:var(--red); background:var(--red-bg); }
    .tx-icon svg { width:17px; height:17px; }
    .tx-info { min-width:0; flex:1; }
    .transaction-title { font-weight:650; font-size:13px; margin-bottom:4px; }
    .transaction-sub { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tx-side { text-align:right; flex:0 0 auto; }
    .tx-amount { font-weight:650; font-size:13px; margin-bottom:4px; }
    .tx-amount.in { color:var(--green); }
    .tx-meta { color:var(--muted-2); font-size:10px; }
    .badge { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:650; border-radius:20px; padding:4px 7px; }
    .badge.success { color:var(--green); background:var(--green-bg); }
    .badge.pending { color:var(--amber); background:var(--amber-bg); }
    .badge.failed { color:var(--red); background:var(--red-bg); }
    .badge.neutral { color:var(--muted); background:#eef2f4; }
    .tip-card { padding:21px; background:#eef5f7; border-color:#d9e8ec; }
    .tip-icon { color:var(--navy-700); margin-bottom:19px; }
    .tip-card p { font-size:13px; line-height:1.55; color:#526874; margin:0 0 20px; }
    .tip-card .text-btn { padding:0; }
    .link-card { margin-top:20px; padding:20px 22px; display:flex; justify-content:space-between; align-items:center; gap:14px; }
    .link-card-copy { display:flex; align-items:center; gap:13px; min-width:0; }
    .link-mini { width:37px; height:37px; border-radius:10px; background:#eef3f5; color:var(--navy-700); display:grid; place-items:center; }
    .link-mini svg { width:17px; }
    .link-card strong { font-size:13px; display:block; margin-bottom:4px; }
    .link-card span { color:var(--muted); font-size:11px; }
    .primary-btn,.secondary-btn,.danger-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:40px; border-radius:8px; padding:0 15px; font-weight:650; font-size:12px; transition:.18s; }
    .primary-btn { color:white; background:var(--navy-900); }
    .primary-btn:hover { background:var(--navy-800); transform:translateY(-1px); }
    .secondary-btn { color:var(--navy-900); background:white; border:1px solid #cbd8df; }
    .secondary-btn:hover { background:var(--blue-50); border-color:#9cb7c4; }
    .danger-btn { background:var(--red-bg); color:var(--red); }
    .danger-btn:hover { background:#ffe5e5; }
    .primary-btn svg,.secondary-btn svg { width:15px; }
    .back-btn { display:inline-flex; align-items:center; gap:7px; background:none; color:var(--muted); font-size:12px; padding:0; margin-bottom:22px; }
    .back-btn:hover { color:var(--navy-900); }
    .back-btn svg { width:16px; }
    .page-intro { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:25px; }
    .page-intro h1 { margin-bottom:6px; }
    .page-actions { display:flex; gap:9px; flex-wrap:wrap; }
    .form-card { max-width:760px; padding:27px; }
    .form-card.wide { max-width:none; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .field { display:flex; flex-direction:column; gap:7px; }
    .field.full { grid-column:1/-1; }
    label { color:#425966; font-size:12px; font-weight:650; }
    input,select,textarea { width:100%; border:1px solid #cfdbe1; background:white; color:var(--ink); border-radius:8px; min-height:43px; padding:0 12px; font-size:13px; transition:.18s; }
    textarea { padding-top:11px; resize:vertical; min-height:90px; }
    input::placeholder,textarea::placeholder { color:#a4afb7; }
    input:focus,select:focus,textarea:focus { border-color:#77aabd; box-shadow:0 0 0 3px rgba(74,139,164,.1); outline:none; }
    .helper { color:var(--muted-2); font-size:11px; line-height:1.4; }
    .form-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:24px; padding-top:19px; border-top:1px solid var(--line); }
    .recipient-list { display:flex; gap:9px; flex-wrap:wrap; margin-top:10px; }
    .recipient { display:flex; align-items:center; gap:7px; border:1px solid var(--line); background:#fbfcfc; border-radius:8px; padding:8px 9px; color:var(--ink); font-size:11px; }
    .recipient:hover,.recipient.selected { border-color:#7cb3c1; background:var(--blue-50); }
    .recipient-avatar { width:24px; height:24px; display:grid; place-items:center; border-radius:50%; background:#deeceb; color:var(--navy-900); font-weight:700; font-size:10px; }
    .summary { background:#f7fafb; border:1px solid var(--line); border-radius:10px; margin-top:22px; padding:16px; }
    .summary-row { display:flex; justify-content:space-between; gap:14px; color:var(--muted); font-size:12px; padding:6px 0; }
    .summary-row strong { color:var(--ink); font-weight:650; }
    .summary-row.total { border-top:1px solid var(--line); margin-top:6px; padding-top:13px; color:var(--ink); }
    .summary-row.total strong { font-size:16px; }
    .method-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:18px 0 22px; }
    .method { min-height:93px; text-align:left; border:1px solid var(--line); border-radius:10px; background:white; padding:13px; color:var(--ink); transition:.18s; }
    .method:hover { border-color:#92b8c4; }
    .method.selected { border:2px solid var(--navy-700); padding:12px; background:var(--blue-50); }
    .method-icon { width:30px; height:30px; border-radius:8px; background:#edf3f5; color:var(--navy-700); display:grid; place-items:center; margin-bottom:12px; }
    .method-icon svg { width:16px; }
    .method b { display:block; font-size:12px; margin-bottom:3px; }
    .method span { color:var(--muted); font-size:10px; }
    .segmented { display:flex; gap:3px; padding:3px; background:#eef2f4; border-radius:8px; width:max-content; }
    .segment { background:transparent; color:var(--muted); padding:8px 13px; border-radius:6px; font-size:11px; }
    .segment.active { background:white; color:var(--navy-900); box-shadow:0 1px 4px rgba(30,60,75,.1); font-weight:650; }
    .id-box { display:flex; align-items:center; justify-content:space-between; gap:13px; border:1px dashed #a7c0ca; border-radius:10px; padding:17px; background:#f8fbfc; margin:20px 0; }
    .id-box strong { display:block; font-size:20px; letter-spacing:1px; margin-top:4px; }
    .id-box .id-actions { display:flex; gap:6px; }
    .icon-label-btn { display:inline-flex; align-items:center; gap:6px; background:white; border:1px solid var(--line); color:var(--navy-700); border-radius:7px; padding:8px 9px; font-size:11px; }
    .icon-label-btn:hover { background:var(--blue-50); }
    .icon-label-btn svg { width:14px; }
    .balance-overview { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
    .overview-cell { padding:19px; }
    .overview-cell .stat-value { margin-top:9px; }
    .overview-cell.featured { background:var(--navy-900); color:white; border-color:var(--navy-900); }
    .overview-cell.featured .stat-label,.overview-cell.featured .stat-detail { color:#a9c4d1; }
    .overview-cell.featured .stat-value { color:white; }
    .chart-card { padding:22px; }
    .chart-header { display:flex; justify-content:space-between; gap:15px; align-items:flex-start; margin-bottom:18px; }
    .chart-header h2 { margin-bottom:4px; }
    .chart-wrap { height:230px; position:relative; border-bottom:1px solid var(--line); border-left:1px solid var(--line); background:repeating-linear-gradient(to bottom,transparent 0,transparent 56px,#edf2f4 57px); }
    .chart-svg { width:100%; height:100%; overflow:visible; }
    .chart-labels { display:flex; justify-content:space-between; color:var(--muted-2); font-size:10px; padding:8px 1px 0; }
    .category-list { display:flex; flex-direction:column; gap:13px; }
    .category-row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
    .category-bar { height:7px; background:#edf2f4; border-radius:5px; overflow:hidden; grid-column:1/-1; }
    .category-bar i { height:100%; display:block; background:var(--navy-700); border-radius:5px; }
    .category-row b { font-size:12px; font-weight:600; }
    .category-row span { font-size:11px; color:var(--muted); }
    .links-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:13px; }
    .payment-link { padding:18px; }
    .payment-link-head { display:flex; justify-content:space-between; gap:13px; align-items:flex-start; margin-bottom:17px; }
    .payment-link h3 { font-size:14px; margin:0 0 5px; }
    .link-amount { font-size:20px; font-weight:700; letter-spacing:-.4px; }
    .link-url { color:var(--navy-700); background:#f4f8f9; padding:9px; border-radius:6px; font-size:11px; margin-bottom:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .link-actions { display:flex; gap:6px; }
    .link-actions button { flex:1; min-height:31px; border:1px solid var(--line); background:white; color:var(--muted); border-radius:6px; font-size:10px; }
    .link-actions button:hover { color:var(--navy-700); background:var(--blue-50); }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .search-box { position:relative; flex:1; min-width:220px; }
    .search-box svg { position:absolute; left:12px; top:12px; width:16px; color:var(--muted-2); }
    .search-box input { padding-left:37px; }
    .filter-row { display:flex; gap:7px; flex-wrap:wrap; }
    .filter-select { min-height:38px; width:auto; min-width:125px; font-size:11px; padding-right:27px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:700px; }
    th { color:var(--muted-2); text-transform:uppercase; letter-spacing:.8px; font-size:10px; font-weight:700; text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); }
    td { padding:14px 12px; border-bottom:1px solid #edf1f3; font-size:12px; vertical-align:middle; }
    tr:last-child td { border-bottom:0; }
    tbody tr { cursor:pointer; transition:.15s; }
    tbody tr:hover { background:#fafcfc; }
    .table-tx { display:flex; align-items:center; gap:10px; min-width:180px; }
    .pagination { display:flex; justify-content:space-between; align-items:center; margin-top:18px; color:var(--muted); font-size:11px; }
    .pagination-actions { display:flex; gap:5px; }
    .pagination-actions button { width:31px; height:31px; border:1px solid var(--line); background:white; color:var(--muted); border-radius:6px; }
    .pagination-actions button:hover { background:var(--blue-50); color:var(--navy-700); }
    .settings-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
    .settings-section { padding:6px 0; }
    .settings-section h3 { color:var(--muted-2); text-transform:uppercase; letter-spacing:1px; font-size:10px; padding:0 16px 8px; }
    .setting-row { display:flex; align-items:center; justify-content:space-between; gap:15px; padding:15px 16px; border-top:1px solid #edf1f3; }
    .setting-row:first-of-type { border-top:0; }
    .setting-copy strong { font-size:13px; display:block; margin-bottom:4px; }
    .setting-copy span { font-size:11px; color:var(--muted); }
    .chevron { color:var(--muted-2); }
    .switch { width:38px; height:22px; padding:2px; border-radius:20px; background:#cbd8dd; transition:.2s; }
    .switch i { width:18px; height:18px; display:block; border-radius:50%; background:white; box-shadow:0 1px 3px rgba(0,0,0,.15); transition:.2s; }
    .switch.on { background:var(--green); }
    .switch.on i { transform:translateX(16px); }
    .security-banner { display:flex; gap:14px; align-items:flex-start; padding:20px; background:#edf7f3; border:1px solid #d5eee3; border-radius:11px; margin-bottom:19px; color:#276c56; }
    .security-banner svg { flex:0 0 auto; }
    .security-banner strong { display:block; color:#175844; margin-bottom:5px; font-size:14px; }
    .security-banner p { margin:0; font-size:12px; line-height:1.5; color:#4c7b6b; }
    .security-list { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }

    function transactionsPage() { let list=transactions.filter(t=>{const term=state.txSearch.toLowerCase(); const search=!term||[t.title,t.sub,t.id,t.party].join(' ').toLowerCase().includes(term); const type=state.txType==='All'||(state.txType==='Money In'&&t.amount>0)||(state.txType==='Money Out'&&t.amount<0)||(state.txType==='Transfers'&&t.title.includes('money'))||(state.txType==='Payments'&&['Airtime','Groceries','Lunch','Payment','Electricity bill','Internet bill'].includes(t.title)); const status=state.txStatus==='All'||t.status===state.txStatus; return search&&type&&status; }); const start=(state.page-1)*8; const shown=list.slice(start,start+8); return `<section class="view">${pageIntro('Transactions','Every movement in and out of your wallet, in one place.') }<div class="card transactions-card"><div class="toolbar"><div class="search-box">${icons.search}<input placeholder="Search transactions" value="${state.txSearch}" oninput="state.txSearch=this.value;state.page=1;render()"></div><div class="filter-row"><select class="filter-select" onchange="state.txType=this.value;state.page=1;render()"><option>All</option><option>Money In</option><option>Money Out</option><option>Transfers</option><option>Payments</option></select><select class="filter-select" onchange="state.txStatus=this.value;state.page=1;render()"><option>All</option><option>Completed</option><option>Pending</option><option>Failed</option></select></div></div>${shown.length?`<div class="table-wrap"><table><thead><tr><th>Transaction</th><th>Reference</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>${shown.map(t=>`<tr onclick="openTransaction('${t.id}')"><td><div class="table-tx">${transactionIcon(t)}<span><b>${t.title}</b><br><small class="muted">${t.sub}</small></span></div></td><td class="muted">${t.id}</td><td class="muted">${t.date}</td><td style="font-weight:650;color:${t.amount>0?'var(--green)':'var(--ink)'}">${money(t.amount)}</td><td>${badge(t.status)}</td></tr>`).join('')}</tbody></table></div><div class="pagination"><span>Showing ${start+1}–${Math.min(start+shown.length,list.length)} of ${list.length}</span><div class="pagination-actions"><button onclick="state.page=Math.max(1,state.page-1);render()" aria-label="Previous page">‹</button><button onclick="state.page++;render()" aria-label="Next page">›</button></div></div>`:`<div class="empty">${icons.clock}<h3>No transactions found</h3><p>Try a different search or filter.</p><button class="secondary-btn" onclick="state.txSearch='';state.txType='All';state.txStatus='All';render()">Clear filters</button></div>`}</div></section>`; }

     function scrubProductCopy(){const replacements=[[/frontend-only/gi,'wallet'],[/frontend demonstration/gi,'personal wallet'],[/frontend preview/gi,'wallet experience'],[/demo mode/gi,'ready when you are'],[/demo only/gi,'Program status'],[/demo transaction/gi,'transaction'],[/demo wallet/gi,'wallet'],[/demo fee/gi,'fee'],[/demo data/gi,'account data'],[/demo/gi,'current'],[/prototype/gi,'product'],[/simulated/gi,'secure'],[/preview/gi,'experience']];const root=document.getElementById('app');const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>{if(!node.parentElement.closest('script,style'))replacements.forEach(([from,to])=>node.nodeValue=node.nodeValue.replace(from,to));});root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(attr=>{if(el.hasAttribute(attr))replacements.forEach(([from,to])=>el.setAttribute(attr,el.getAttribute(attr).replace(from,to)))}));}

     function scrollContainer() {
       const candidates=['.main-content','.app-content','.workspace','.page-container'];
       for(const selector of candidates) {
         const element=document.querySelector(selector);
         if(element) {
           const style=getComputedStyle(element);
           if(element.scrollHeight>element.clientHeight&&['auto','scroll'].includes(style.overflowY))return element;
         }
       }
       return null;
     }
     function currentScrollPosition(){const container=scrollContainer();return container?container.scrollTop:window.scrollY;}
     function restoreScrollPosition(y=0){requestAnimationFrame(()=>{const container=scrollContainer();if(container)container.scrollTo({top:y,left:0,behavior:'instant'});else window.scrollTo({top:y,left:0,behavior:'instant'});});}
     function navigate(view,replace=false) {

       history.replaceState({...currentEntry,view:from,scrollY:currentScrollPosition()},'',location.href);
       state.previous=from;state.view=view;state.drawer=false;state.notifications=false;state.profile=false;state.flow=null;state.page=1;
       history[replace?'replaceState':'pushState']({view,from,scrollY:0},'',`#${view}`);
       transitionRender(view,false);
     }
     function transitionRender(view,back=false){render();const next=document.querySelector('.view');if(next&&back)next.classList.add('page-back');restoreScrollPosition(0);}
     function goBack() { if(history.length>1){history.back();}else{navigate('dashboard');} }
    function toggleBalance(){state.balanceVisible=!state.balanceVisible;render();}
    function toggleDrawer(open){state.drawer=open;render();}
     function toggleNotifications(){state.notifications=!state.notifications;state.profile=false;if(state.notifications)state.notificationRead=false;render();if(state.notifications)setTimeout(()=>showToast('Payment received · K 250 from Brian'),500);}
    function toggleProfile(){state.profile=!state.profile;state.notifications=false;render();}
     function showToast(message){message=message.replace(/demo|prototype|simulated|frontend-only|preview/gi,'');const el=document.createElement('div');el.className='toast';el.innerHTML=`${icons.check}<span>${message}</span>`;document.getElementById('toast-stack').appendChild(el);setTimeout(()=>el.remove(),3200);}
    function copyText(text){ if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{}); showToast('Copied to clipboard'); }
    function selectRecipient(name,id){const el=document.getElementById('send-recipient');if(el)el.textContent=`${name} · ${id}`;showToast(`${name} selected`);}
    function openTransaction(id){state.selectedTx=transactions.find(t=>t.id===id);state.flow='transaction';renderModal();}
    function renderModal(){document.body.insertAdjacentHTML('beforeend',modalMarkup());}
    function modalMarkup(){if(!state.flow&&!state.selectedTx)return '';let body='';let title='';if(state.flow==='transaction'&&state.selectedTx){const t=state.selectedTx;title='Transaction details';body=`<div class="detail-amount">${transactionIcon(t)}<strong>${money(t.amount)}</strong>${badge(t.status)}<p class="small muted" style="margin:10px 0 0">${t.title}</p></div><div class="detail-list"><div class="detail-row"><span>Date</span><strong>${t.date.split(',')[0]}</strong></div><div class="detail-row"><span>Time</span><strong>${t.date.split(',')[1]||'10:42'}</strong></div><div class="detail-row"><span>Reference</span><strong>${t.id}</strong></div><div class="detail-row"><span>${t.amount>0?'Sender':'Recipient'}</span><strong>${t.party}</strong></div><div class="detail-row"><span>Payment method</span><strong>${t.method}</strong></div><div class="detail-row"><span>Fee</span><strong>${t.fee}</strong></div><div class="detail-row"><span>Total</span><strong>${money(t.amount<0?Math.abs(t.amount)+parseFloat(t.fee.replace(/[^\\d.]/g,'')):t.amount)}</strong></div></div><div class="timeline"><span class="timeline-step done"><i></i>Created</span><span class="timeline-step done"><i></i>Processing</span><span class="timeline-step ${t.status==='Completed'?'done':''}"><i></i>${t.status}</span></div>`;}return `<div class="modal-backdrop open" id="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title||'ZedMoney'}</h2><button class="icon-btn" aria-label="Close" onclick="closeModal()">${icons.close}</button></div><div class="modal-body">${body}<div class="modal-actions"><button class="secondary-btn" onclick="closeModal()">Close</button></div></div></div></div>`;}
    function closeModal(){state.flow=null;state.selectedTx=null;document.querySelectorAll('.modal-backdrop').forEach(x=>x.remove());}
    function startFlow(kind){closeModal();state.flow=kind;document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop open" id="flow-modal"><div class="modal"><div class="processing"><svg class="logo-mark" style="color:var(--navy-900)" viewBox="0 0 48 48"><path fill="currentColor" d="M24 3.5 40 9v12.3c0 10.1-6.5 18.9-16 23.2-9.5-4.3-16-13.1-16-23.2V9L24 3.5Z"/><path fill="#79c4ca" d="M24 9.2 34.4 13v8.1c0 6.9-4.1 13-10.4 16.5-6.3-3.5-10.4-9.6-10.4-16.5V13L24 9.2Z"/><path fill="#fff" d="m17.6 23.3 4.2 4.2 9.1-10.1 2.2 2-11.2 12.5-6.4-6.4 2.1-2.2Z"/></svg><div class="dotted-loader"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><h2 id="flow-title">${kind==='send'?'Securing your transfer':kind==='withdraw'?'Processing withdrawal':'Processing payment'}</h2><p id="flow-copy">Checking payment status...</p></div></div></div>`);setTimeout(()=>{const t=document.getElementById('flow-title'),c=document.getElementById('flow-copy');if(t){t.textContent=kind==='withdraw'?'Withdrawal completed':kind==='send'?'Payment successful':'Payment completed';c.textContent=kind==='withdraw'?'Your withdrawal is ready for confirmation.':'Transaction completed';document.querySelector('#flow-modal .dotted-loader').outerHTML='<div class="success-mark">'+icons.check+'</div>';document.querySelector('#flow-modal .processing').insertAdjacentHTML('beforeend','<button class="primary-btn" onclick="closeFlow();showToast(&quot;Demo transaction completed&quot;)">Done</button>');}},2100);}
    function closeFlow(){document.getElementById('flow-modal')?.remove();state.flow=null;}
    function disableLink(code){const l=state.links.find(x=>x.code===code);if(l){l.status='Disabled';render();showToast('Payment link disabled');}}
    function createPaymentLink(){const name=document.getElementById('link-name').value||'New payment request',amount=Number(document.getElementById('link-amount').value)||500,description=document.getElementById('link-description').value||'Payment request';const code=Math.random().toString(36).slice(2,7).toUpperCase();state.links.unshift({name,amount,status:'Active',code,description,expires:'30 Sep 2026'});navigate('links');showToast('Payment link created');}
    function toggleSetting(btn){btn.querySelector('.switch')?.classList.toggle('on');showToast('Settings updated');}
    document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();openGlobalSearch();}if(e.key==='Escape'){state.drawer=false;state.notifications=false;state.profile=false;closeModal();closeFlow();render();}});
    window.addEventListener('popstate',()=>{state.view=history.state?.view||location.hash.slice(1)||'dashboard';state.modal=null;state.previous=history.state?.from||state.view;render();const next=document.querySelector('.view');if(next)next.classList.add('page-back');restoreScrollPosition(history.state?.scrollY||0);});
    document.addEventListener('click',e=>{if(!e.target.closest('.profile-wrap')&&state.profile){state.profile=false;render();}if(!e.target.closest('.notification-panel')&&!e.target.closest('[aria-label="Notifications"]')&&state.notifications){state.notifications=false;render();}});
    state.view=location.hash.slice(1)||'dashboard';history.replaceState({view:state.view,scrollY:0},'',location.href);render();restoreScrollPosition(0);setTimeout(()=>document.getElementById('loading-cover').classList.add('hidden'),850);
  </script>
</body>
</html>
